spring.application.name=Surprise
server.port=${SERVER_PORT:8086}

# These defaults are for an isolated, loopback-only development database.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5546/surprise_basket_db}
spring.datasource.username=${DB_USERNAME:surprise_basket}
spring.datasource.password=${DB_PASSWORD:surprise_local_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
