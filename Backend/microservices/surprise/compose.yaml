name: foodrescue-surprise

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: surprise_basket_db
      POSTGRES_USER: ${DB_USERNAME:-surprise_basket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-surprise_local_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5546}:5432"
    volumes:
      - surprise-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  surprise-postgres-data:
